<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ecf5f0" />
    <meta name="description" content="Law Quiz KZ — образовательный сайт для изучения гражданского права Республики Казахстан." />
    <title>Law Quiz KZ — изучай гражданское право</title>
    <script>
      try {
        if (localStorage.getItem('lqkz-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.style.colorScheme = 'dark'
          var themeMeta = document.querySelector('meta[name="theme-color"]')
          if (themeMeta) themeMeta.setAttribute('content', '#0c1412')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
